  생성: 2026-05-22 (Claude Design 워크플로 v1)
  Prompt: prompt-stickers.md
  DesignAsset: STORE-01-STD sticker_sheet v1
  Cutline: 각 스티커 외곽 라인. vendor 다이컷 가이드 별도 적용 필요.
