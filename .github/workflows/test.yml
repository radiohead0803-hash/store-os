name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: ruff lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: store-os
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.15.14

      - name: Run ruff check
        run: ruff check scripts/ tests/ examples/mini-mvp/

  test:
    name: store_ops unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: store-os
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Python and OS
        run: |
          python --version
          uname -a

      - name: Run store_ops unittest suite
        run: |
          python -m unittest tests.test_store_ops -v

      - name: Smoke-test CLI scripts (--help)
        run: |
          python scripts/legal_check.py --help
          python scripts/init_store_project.py --help
          python scripts/cost_calculator.py --help
          python scripts/validate_idea.py "테스트 아이디어" || true
